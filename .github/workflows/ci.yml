name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:
  schedule:
    - cron: "17 4 * * 1"

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  changes:
    name: Detect changed paths
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      pull-requests: read
    outputs:
      code: ${{ steps.filter.outputs.code }}
    steps:
      - name: Checkout for change detection
        if: ${{ github.event_name != 'workflow_dispatch' && github.event_name != 'schedule' }}
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Filter changed paths
        id: filter
        if: ${{ github.event_name != 'workflow_dispatch' && github.event_name != 'schedule' }}
        uses: dorny/paths-filter@v4
        with:
          base: ${{ github.ref }}
          filters: |
            code:
              - 'build.zig'
              - 'build.zig.zon'
              - 'src/**'
              - 'examples/**'
              - 'tests/**'
              - 'vendor/**'
              - '.gitattributes'
              - '.github/workflows/**'

  format:
    name: Zig formatting
    needs: changes
    if: ${{ needs.changes.outputs.code == 'true' || github.event_name == 'workflow_dispatch' || github.event_name == 'schedule' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: mlugg/setup-zig@v2
        with:
          version: 0.17.1

      - name: Check Zig formatting
        run: zig fmt --check build.zig src examples tests

  build:
    name: ${{ matrix.os }} / ${{ matrix.optimize }}
    needs: changes
    if: ${{ needs.changes.outputs.code == 'true' || github.event_name == 'workflow_dispatch' || github.event_name == 'schedule' }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, windows-2025]
        optimize: [Debug, ReleaseSafe]

    steps:
      - uses: actions/checkout@v4

      - name: Install SDL development dependencies (Linux)
        if: runner.os == 'Linux'
        shell: bash
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            pkg-config xvfb xauth \
            libx11-dev libxext-dev libxrandr-dev \
            libxcursor-dev libxi-dev libxfixes-dev libxss-dev \
            libxkbcommon-dev libwayland-dev wayland-protocols \
            libasound2-dev libpulse-dev libudev-dev libdbus-1-dev \
            libdrm-dev libgbm-dev libegl1-mesa-dev libgl1-mesa-dev \
            libvulkan-dev

      - name: Set up Zig 0.17.1
        uses: mlugg/setup-zig@v2
        with:
          version: 0.17.1

      - name: Print Zig version
        run: zig version

      - name: Build SDL
        run: zig build -Doptimize=${{ matrix.optimize }}

      - name: Build all examples
        run: zig build examples -Doptimize=${{ matrix.optimize }}
        
      - name: Run binding tests (Linux)
        if: runner.os == 'Linux'
        env:
          SDL_VIDEODRIVER: x11
          SDL_AUDIODRIVER: dummy
        run: |
          xvfb-run --auto-servernum \
            --server-args="-screen 0 1280x720x24" \
            zig build test -Doptimize=${{ matrix.optimize }}

      - name: Run binding tests (Windows / macOS)
        if: runner.os != 'Linux'
        run: zig build test -Doptimize=${{ matrix.optimize }}

      - name: Generate raw C bindings
        if: matrix.optimize == 'Debug'
        run: zig build bindings

      - name: Build Vulkan surface bindings
        if: matrix.os == 'ubuntu-24.04' && matrix.optimize == 'ReleaseSafe'
        run: zig build -Dvulkan=true -Doptimize=ReleaseSafe

      - name: Build shared SDL library
        if: matrix.optimize == 'ReleaseSafe'
        run: zig build -Dshared=true -Doptimize=ReleaseSafe

      - name: Run headless info example
        if: matrix.os == 'ubuntu-24.04' && matrix.optimize == 'Debug'
        env:
          SDL_VIDEODRIVER: dummy
          SDL_AUDIODRIVER: dummy
        run: zig build run-info

  ci-status:
    name: CI status
    needs: [changes, format, build]
    if: ${{ always() }}
    runs-on: ubuntu-24.04
    steps:
      - name: Verify required checks
        shell: bash
        env:
          CHANGES_RESULT: ${{ needs.changes.result }}
          FORMAT_RESULT: ${{ needs.format.result }}
          BUILD_RESULT: ${{ needs.build.result }}
          CODE_CHANGED: ${{ needs.changes.outputs.code }}
          EVENT_NAME: ${{ github.event_name }}
        run: |
          if [[ "$CHANGES_RESULT" != "success" ]]; then
            echo "Change detection failed: $CHANGES_RESULT"
            exit 1
          fi

          if [[ "$CODE_CHANGED" == "true" ||
                "$EVENT_NAME" == "workflow_dispatch" ||
                "$EVENT_NAME" == "schedule" ]]; then
            if [[ "$FORMAT_RESULT" != "success" || "$BUILD_RESULT" != "success" ]]; then
              echo "Format=$FORMAT_RESULT Build=$BUILD_RESULT"
              exit 1
            fi
          fi

          echo "All required CI checks passed."
